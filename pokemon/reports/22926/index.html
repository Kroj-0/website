    // Use a global variable for the table so we can access it
    let table;
    let lastWindowWidth = $(window).width(); // Store the initial width

    function initAdaptiveTable() {
        const isMobile = window.innerWidth <= 1001;
        const pageInfo = table ? table.page.info() : { page: 0, length: 10 }; // Save current page and length

        // Destroy existing table if it exists
        if ($.fn.DataTable.isDataTable('#cardTable')) {
            $('#cardTable').DataTable().destroy();
        }

        // Initialize the new table
        table = $('#cardTable').DataTable({
            data: cardData,
            destroy: true,
            autoWidth: false,
            scrollX: false,
            deferRender: true,
            order: [[4, 'desc']], // EUR price
            pageLength: pageInfo.length, // Restore previous length
            displayStart: pageInfo.page * pageInfo.length, // Restore previous page
            columns: [
                {
                    data: 'image_url',
                    orderable: false,
                    render: d => d ? `<img src="${d}" class="card-image" loading="lazy">` : ''
                },
                {
                    data: 'name',
                    render: (d, type, row) => {
                        let displayName = d;
                        if (type === 'display' && d.length > 50) {
                           displayName = `<span title="${d}">${d.slice(0, 50)}…</span>`;
                        }
                        
                        if (isMobile) {
                            return `<a href="${row.main_url}" target="_blank">${displayName}</a>`;
                        }
                        return displayName;
                    }
                },
                { data: 'number', className: 'dt-center', visible: !(isMobile && window.innerWidth < 500) },
                { data: 'rank', className: 'dt-center', visible: !(isMobile && window.innerWidth < 400) },
                {
                    data: 'price_jpy_val',
                    className: 'price-eur dt-right',
                    render: (d, type) => {
                        if (type === 'display') return d == null ? 'N/A' : `€${(d * exchange_rate).toFixed(2)}`;
                        return d; // for sorting
                    }
                },
                {
                    data: 'price_jpy_val',
                    className: 'price-jpy dt-right',
                    visible: !(isMobile && window.innerWidth < 600),
                    render: (d, type) => {
                        if (type === 'display') return d == null ? 'N/A' : `${d} JPY`;
                        return d; // for sorting
                    }
                },
                {
                    data: 'main_url',
                    orderable: false,
                    className: 'dt-center',
                    visible: !isMobile,
                    render: d => `<a href="${d}" target="_blank">View</a>`
                }
            ]
        });
    }

    $(document).ready(function () {
        // --- Dark Mode Logic ---
        const themeToggle = document.getElementById('theme-toggle');
        const applyTheme = (theme) => {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.checked = true;
            } else {
                document.body.classList.remove('dark-mode');
                themeToggle.checked = false;
            }
        };
        applyTheme(localStorage.getItem('theme'));
        themeToggle.addEventListener('change', function () {
            const newTheme = this.checked ? 'dark' : 'light';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        });

        // --- Exchange Rate Logic ---
        $('#exchange-rate').on('input', function () {
            const newRate = parseFloat(this.value);
            const note = document.getElementById("exchange-rate-note");
            if (!isNaN(newRate) && newRate > 0 && table) {
                exchange_rate = newRate;
                table.rows().invalidate('data').draw(false); // Re-render but keep pagination
                note.style.display = (this.value !== this.defaultValue) ? "none" : "block";
            }
        });

        // --- Lightbox Logic ---
        $('#cardTable').on('click', '.card-image', function(e) {
            e.preventDefault();
            const imgSrc = $(this).attr('src');
            const $overlay = $(`<div class="image-focus-overlay"><img src="${imgSrc}" alt="Focused card image"></div>`);
            $('body').append($overlay);
            setTimeout(() => $overlay.addClass('visible'), 10);
        });
        $(document).on('click', '.image-focus-overlay', function() {
            const $overlay = $(this);
            $overlay.removeClass('visible');
            setTimeout(() => $overlay.remove(), 300);
        });

        // --- SMART DEBOUNCED RESIZE LOGIC ---
        let resizeTimer;
        $(window).on('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                const currentWidth = $(window).width();
                // ONLY re-initialize if the width has actually changed
                if (currentWidth !== lastWindowWidth) {
                    initAdaptiveTable();
                    lastWindowWidth = currentWidth; // Update the stored width
                }
            }, 250);
        });

        // Initial table load
        initAdaptiveTable();
    });
    </script>
