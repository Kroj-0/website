<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Replenishment Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- Base and Light Mode Variables --- */
        :root {
            --bg-color: #f4f7f9;
            --text-color: #2c3e50;
            --container-bg: #ffffff;
            --header-color: #1a252f;
            --border-color: #e1e8ed;
            --subtle-text: #8899a6;
            --card-hover-shadow: rgba(44, 62, 80, 0.15);
            --link-color: #3498db;
        }

        /* --- Dark Mode Overrides --- */
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --container-bg: #1e1e1e;
            --header-color: #ffffff;
            --border-color: #444444;
            --subtle-text: #999999;
            --card-hover-shadow: rgba(255, 255, 255, 0.1);
            --link-color: #5dade2;
        }
        
        /* --- General Body and Layout Styles --- */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2em;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: var(--container-bg);
            padding: 2em 2.5em;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .07);
            transition: background-color 0.3s;
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--header-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: .5em;
            text-align: center;
            font-size: 2.2em;
            letter-spacing: -1px;
        }

        /* --- Theme Switch --- */
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 1001;
            background: var(--container-bg);
            padding: 8px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
        }
        .theme-switch-label { margin-right: 10px; font-size: 0.9em; font-weight: bold; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; }
        input:checked+.slider { background-color: #2196F3; }
        input:checked+.slider:before { transform: translateX(26px); }
        .slider.round { border-radius: 24px; }
        .slider.round:before { border-radius: 50%; }

        /* --- Reports Grid and Cards --- */
        #reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8em;
            margin-top: 2.5em;
        }
        
        #loading-state, #error-state {
            text-align: center;
            color: var(--subtle-text);
            padding: 3em 0;
            font-size: 1.1em;
        }

        .report-card {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .report-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 20px var(--card-hover-shadow);
        }

        .card-thumbnail {
            width: 100%;
            height: 300px;
            background-color: #eef2f5;
            background-size: cover;
            background-position: top;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #b0c4de;
            font-size: 1.2em;
            border-bottom: 1px solid var(--border-color);
        }

        body.dark-mode .card-thumbnail {
            background-color: #2c2c2c;
            color: #555;
        }

        .card-content {
            padding: 1.2em;
            flex-grow: 1; /* Ensures content area fills space */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-weight: 700;
            font-size: 1.15em;
            margin: 0 0 0.5em 0;
            line-height: 1.3;
        }

        .card-meta {
            font-size: 0.9em;
            color: var(--subtle-text);
        }
    </style>
</head>

<body>
    <div class="theme-switch-wrapper">
        <span class="theme-switch-label">Dark Mode</span>
        <label class="theme-switch"><input type="checkbox" id="theme-toggle"><span class="slider round"></span></label>
    </div>

    <div class="container">
        <h1>Pokémon Card Replenishment Hub</h1>
        <div id="reports-grid">
            <div id="loading-state">Loading reports...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- Dark Mode Logic ---
            // It's placed first to avoid a "flash" of the wrong theme on page load.
            const themeToggle = document.getElementById('theme-toggle');
            const storedTheme = localStorage.getItem('theme');
            
            const applyTheme = (theme) => {
                if (theme === 'dark') {
                    document.body.classList.add('dark-mode');
                    themeToggle.checked = true;
                } else {
                    document.body.classList.remove('dark-mode');
                    themeToggle.checked = false;
                }
            };

            applyTheme(storedTheme); // Apply theme on initial load

            themeToggle.addEventListener('change', function () {
                const newTheme = this.checked ? 'dark' : 'light';
                localStorage.setItem('theme', newTheme);
                applyTheme(newTheme);
            });

            // --- Dynamic Report Loading ---
            const reportsGrid = document.getElementById('reports-grid');

            async function fetchReportMetadata(url) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) return { title: "Report Not Found", image: null };

                    const text = await response.text();
                    const doc = new DOMParser().parseFromString(text, 'text/html');

                    // Try to get title normally
                    const titleElement = doc.querySelector('h1');
                    const title = titleElement ? titleElement.textContent.trim() : "Untitled Report";

                    // Look for "image_url" in the raw HTML
                    let image = null;
                    const imageMatch = text.match(/"image_url"\s*:\s*"([^"]+)"/);
                    if (imageMatch) {
                        image = imageMatch[1];
                    }

                    return { title, image };
                } catch (error) {
                    console.error('Error fetching report metadata:', url, error);
                    return { title: "Could Not Load Report", image: null };
                }
            }

            
            async function populateReports() {
                try {
                    const response = await fetch('reports.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const reportIds = await response.json();

                    // Clear the loading state
                    reportsGrid.innerHTML = '';
                    
                    if (reportIds.length === 0) {
                        reportsGrid.innerHTML = '<div id="error-state">No reports found.</div>';
                        return;
                    }

                    // Create a card for each report
                    for (const postId of reportIds) {
                        const reportPath = `${postId}/index.html`;
                        const card = document.createElement('a');
                        card.className = 'report-card';
                        card.href = reportPath;
                        
                        // Set up card structure immediately for better perceived performance
                        card.innerHTML = `
                            <div class="card-thumbnail">Loading...</div>
                            <div class="card-content">
                                <h3 class="card-title">Report #${postId}</h3>
                            </div>
                        `;
                        reportsGrid.appendChild(card);
                        
                        // Fetch the actual data and update the card
                        const metadata = await fetchReportMetadata(reportPath);
                        
                        const thumbnailDiv = card.querySelector('.card-thumbnail');
                        const titleH3 = card.querySelector('.card-title');

                        titleH3.textContent = metadata.title;
                        
                        if (metadata.image) {
                            thumbnailDiv.style.backgroundImage = `url(${metadata.image})`;
                            thumbnailDiv.textContent = ''; // Clear "Loading..." text
                        } else {
                            thumbnailDiv.textContent = 'No Preview';
                        }
                    }
                } catch (error) {
                    console.error('Failed to load reports list:', error);
                    reportsGrid.innerHTML = `<div id="error-state">Error loading reports. <br>Please ensure 'reports.json' exists and is accessible.</div>`;
                }
            }

            populateReports();
        });
    </script>
</body>

</html>
