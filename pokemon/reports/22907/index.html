            --border-color: #444444;
            --subtle-text: #999999;

            --eur-color: #48c774;

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 1.5em;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            background: var(--container-bg);
            padding: 2em;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, .1);
            transition: background-color 0.3s;
        }

        h1,
        h2 {
            color: var(--header-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: .5em;
        }

        h2 {
            font-size: 1.2em;
            color: var(--subtle-text);
        }

        .report-meta {
            margin-bottom: 2em;
            color: var(--subtle-text);
        }

        .card-image {
            width: 70px;
            height: auto;
            border-radius: 5px;
            transition: transform .2s ease-in-out;
        }

        .card-image:hover {
            transform: scale(3);
            z-index: 1000;
            position: relative;
        }

        table.dataTable thead th {
            background-color: var(--table-header-bg);
            color: var(--header-color);
            border-bottom: 2px solid var(--border-color);
        }

        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            color: var(--text-color) !important;
        }

        .price-eur {
            font-weight: 700;
            color: var(--eur-color);
        }

        .price-jpy {
            color: var(--subtle-text);
        }

        a {
            color: #007bff;
        }

        body.dark-mode a {
            color: #3391ff;
        }

        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            position: fixed;
            top: 10px;
            right: 15px;
            z-index: 1001;
            background: var(--container-bg);
            padding: 8px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
        }

        .theme-switch-label {
            margin-right: 10px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
        }

        input:checked+.slider {
            background-color: #2196F3;
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        .slider.round {
            border-radius: 24px;
        }

        .slider.round:before {
            border-radius: 50%;
        }
    </style>
</head>

                columns: [

                    { data: 'name' }, { data: 'number' }, { data: 'rank' },
                    { data: 'price_eur_val', className: 'price-eur', render: (d) => d != null ? `€${d.toFixed(2)}` : 'N/A' },
                    { data: 'price', className: 'price-jpy' },
                    { data: 'main_url', orderable: false, render: (d) => `<a href="${d}" target="_blank">View</a>` }
                ]
            });
            const themeToggle = document.getElementById('theme-toggle');
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme === 'dark') { document.body.classList.add('dark-mode'); themeToggle.checked = true; }
            themeToggle.addEventListener('change', function () {
                if (this.checked) { document.body.classList.add('dark-mode'); localStorage.setItem('theme', 'dark'); }
                else { document.body.classList.remove('dark-mode'); localStorage.setItem('theme', 'light'); }
            });
        });
    </script>
