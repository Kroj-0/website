                function initAdaptiveTable() {
            const isMobile = window.innerWidth <= 1001;

            // Destroy existing table if it exists
            if ($.fn.DataTable.isDataTable('#cardTable')) {
                $('#cardTable').DataTable().destroy();
            }

            const table = $('#cardTable').DataTable({
                data: cardData,
                destroy: true,
                autoWidth: false,
                scrollX: true,
                deferRender: true,
                order: [[4, 'desc']], // EUR price
                pageLength: 10,
                columns: [
                    {
                        data: 'image_url',
                        orderable: false,
                        render: d => d ? `<img src="${d}" class="card-image" loading="lazy">` : ''
                    },
                    {
                        data: 'name',
                        render: (d, type, row) => {
                            // Crop name to 50 chars minimum, add link on mobile
                            let displayName = d.length > 50 ? d.slice(0, 50) + '…' : d;
                            if (isMobile) {
                                return `<a href="${row.main_url}" target="_blank">${displayName}</a>`;
                            }
                            return displayName;
                        }
                    },
                    { data: 'number', visible: !(isMobile && window.innerWidth < 500) },
                    { data: 'rank', visible: !(isMobile && window.innerWidth < 400) },
                    {
                        data: 'price_jpy_val',
                        className: 'price-eur',
                        render: d => d == null ? 'N/A' : `€${(d * exchange_rate).toFixed(2)}`
                    },
                    {
                        data: 'price_jpy_val',
                        className: 'price-jpy',
                        visible: !(isMobile && window.innerWidth < 600),
                        render: d => d == null ? 'N/A' : `${d} JPY`
                    },
                    {
                        data: 'main_url',
                        orderable: false,
                        visible: !isMobile,
                        render: d => `<a href="${d}" target="_blank">View</a>`
                    }
                ]
            });
        }

        $(document).ready(function () {

            // Handle exchange rate changes
            $('#exchange-rate').on('input', function () {
                const newRate = parseFloat(this.value);
                const note = document.getElementById("exchange-rate-note");
                if (!isNaN(newRate) && newRate > 0) {
                    exchange_rate = newRate;
                    table.rows().invalidate().draw(); // re-render EUR prices
                
                    // Hide note once user modifies the rate manually
                    if (this.value !== this.defaultValue) {
                        note.style.display = "none";
                    } else {
                        note.style.display = "block";
                    }
                }
            });

            // Dark mode toggle (your original logic)
            const themeToggle = document.getElementById('theme-toggle');
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.checked = true;
            }
            themeToggle.addEventListener('change', function () {
                if (this.checked) {
                    document.body.classList.add('dark-mode');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.body.classList.remove('dark-mode');
                    localStorage.setItem('theme', 'light');
                }
            });

            // --- START: Focus Mode / Lightbox Logic ---
            $('#cardTable').on('click', '.card-image', function(e) {
                e.preventDefault(); // Prevent any default browser action
                const imgSrc = $(this).attr('src');
                
                // Create and append the overlay with the image
                const $overlay = $(
                    `<div class="image-focus-overlay">
                        <img src="${imgSrc}" alt="Focused card image">
                    </div>`
                );
                $('body').append($overlay);

                // Use a short timeout to allow the element to be added to the DOM before triggering the CSS transition
                setTimeout(() => {
                    $overlay.addClass('visible');
                }, 10);
            });

            // Add a listener to the body to close the overlay when it's clicked
            // This is more robust than attaching it directly to the overlay
            $(document).on('click', '.image-focus-overlay', function() {
                const $overlay = $(this);
                $overlay.removeClass('visible');

                // Remove the element from the DOM after the fade-out transition completes
                setTimeout(() => {
                    $overlay.remove();
                }, 300); // This duration should match the CSS transition time
            });
            // --- END: Focus Mode / Lightbox Logic ---

            initAdaptiveTable();

            // Reinitialize on window resize
            $(window).on('resize', function () {
                initAdaptiveTable();
            });
        });

    </script>
