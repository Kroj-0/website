<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons"/>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- Main custom CSS -->
    <link rel="stylesheet" type="text/css" href="/css/stylesheet.css"  />
    <!-- Prism theme placeholder -->
    <link id="prism-theme-link" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" />

    <title>Note | Home Project</title>
</head>

<body>
    <!-- The sidebar will be injected here by our script -->
    <div id="sidebar-container"></div>

    <main role="main">
        <div class="container">
            <div class="theme-switcher-container">
                <label class="theme-switcher" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider round"></div>
                </label>
            </div>
            
            <!-- NEW Secondary Top-Tab Navigation -->
            <nav class="main-nav">
                <a href="/home" class="active">📝 Appunti Generali</a>
                <a href="/home/garden">💧 Guida Irrigazione</a>
            </nav>

            <h1>📝 Appunti Generali</h1>

            <!-- OVERLAY for Loading -->
            <div id="loading-indicator">⌛️ Caricamento...</div>
            
            <!-- Dynamic content will be injected here -->
            <div id="notes-container"></div>
        </div>
    </main>

    <!--
      SCRIPT LOADING SECTION
      We load all third-party libraries first, directly in the HTML.
      This ensures they are available in the global scope when our main.js script runs.
    -->
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="https://kit.fontawesome.com/93028db3a0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    
    <script type="text/javascript">
    // --- DYNAMIC CONTENT LOADER ---
    async function loadNotes() {
        // !!! IMPORTANT: Paste your Apps Script URL here !!!
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbxJmNjXxlOmQlYhM4ICLs6zhfV-c3Bf2bDUl1Qoh6T8GI8YLLBaq9WynGwtWFO58bYd/exec';
        const notesContainer = document.getElementById('notes-container');
        const loadingIndicator = document.getElementById('loading-indicator');

        loadingIndicator.style.display = 'flex';

        try {
            const response = await fetch(scriptUrl);
            if (!response.ok) {
                throw new Error(`Network response was not ok: ${response.statusText}`);
            }
            const sections = await response.json();
            
            if(sections.error) {
              throw new Error(`Apps Script Error: ${sections.error}`);
            }

            notesContainer.innerHTML = ''; // Clear any previous content

            // Render each section from the fetched data
            sections.forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'note-section';

                const titleH2 = document.createElement('h2');
                titleH2.innerHTML = section.title; // Use innerHTML to render emojis
                sectionDiv.appendChild(titleH2);

                const descP = document.createElement('p');
                descP.textContent = section.description;
                sectionDiv.appendChild(descP);

                section.subsections.forEach(subsection => {
                    
                    // Only create and append the H3 element if the subsection title is not empty.
                    if (subsection.title && subsection.title.trim() !== '') {
                        const subTitleH3 = document.createElement('h3');
                        subTitleH3.textContent = subsection.title;
                        sectionDiv.appendChild(subTitleH3);
                    }


                    if (subsection.items && subsection.items.length > 0) {
                        const itemsUl = document.createElement('ul');
                        subsection.items.forEach(item => {
                            const itemLi = document.createElement('li');
                            const strongTag = document.createElement('strong');
                            strongTag.textContent = `${item.key}`;
                            if(item.value){
                                strongTag.textContent += ': '
                            }
                            
                            itemLi.appendChild(strongTag);
                            itemLi.appendChild(document.createTextNode(item.value));
                            itemsUl.appendChild(itemLi);
                        });
                        sectionDiv.appendChild(itemsUl);
                    }
                });

                notesContainer.appendChild(sectionDiv);
            });

        } catch (error) {
            console.error('Failed to load notes:', error);
            notesContainer.innerHTML = `<div class="note-section" style="text-align:center; color: var(--red-color);">
                                            <h2>✖️ Errore nel caricamento</h2>
                                            <p>Impossibile caricare gli appunti. Controlla la console per maggiori dettagli.</p>
                                        </div>`;
        } finally {
            loadingIndicator.style.display = 'none';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Load the dynamic content
        loadNotes();
    });
    </script>
    <script src="/js/main.js"></script>
</body>
</html>
